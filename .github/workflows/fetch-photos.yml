name: Fetch website photos
on:
  push:
    branches: [website-photos]
    paths: [photos/list.txt, .github/workflows/fetch-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          cd photos
          while read -r id url; do
            [ -z "$id" ] && continue
            ext="${url##*.}"
            curl -sSfL --retry 3 -o "$id.$ext" "$url" || echo "failed $id"
          done < list.txt
          ls | wc -l
      - name: Commit
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add photos/
          git commit -m "Add website images" || echo "nothing"
          git push
